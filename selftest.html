<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Alto Fingering Player selftest</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
    .ok { color: #2ee9c5; }
    .fail { color: #ff6b7a; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Selftest</h1>
  <pre id="out"></pre>
  <script src="fingerings.js"></script>
  <script src="parser.js"></script>
  <script src="demo.js"></script>
  <script src="library.js"></script>
  <script src="tuner.js"></script>
  <script>
    const lines = [];
    let failed = 0;
    function eq(name, a, b) {
      const ok = JSON.stringify(a) === JSON.stringify(b);
      if (!ok) failed++;
      lines.push((ok ? "OK  " : "FAIL") + " " + name + (ok ? "" : " got " + JSON.stringify(a) + " expected " + JSON.stringify(b)));
    }
    function ok(name, cond) {
      if (!cond) failed++;
      lines.push((cond ? "OK  " : "FAIL") + " " + name);
    }
    const F = Fingerings;
    function keys(name) { return (F.lookupWritten(name).keys || []).slice().sort(); }

    eq("G4", keys("G4"), ["L1", "L2", "L3"].sort());
    eq("A4", keys("A4"), ["L1", "L2"].sort());
    eq("Bb4 side", keys("Bb4"), ["L1", "L2", "sideBb"].sort());
    eq("C5 L2 only", keys("C5"), ["L2"]);
    ok("G4 no octave", keys("G4").indexOf("octave") < 0);
    ok("D5 has octave", keys("D5").indexOf("octave") >= 0);
    eq("D5", keys("D5"), ["octave", "L1", "L2", "L3", "R1", "R2", "R3"].sort());
    eq("low Bb", keys("Bb3"), ["L1", "L2", "L3", "R1", "R2", "R3", "lowBb", "lowC"].sort());
    eq("low C", keys("C4"), ["L1", "L2", "L3", "R1", "R2", "R3", "lowC"].sort());
    eq("B4", keys("B4"), ["L1"]);
    eq("C#5 open", keys("C#5"), []);
    eq("F#4 fork", keys("F#4"), ["L1", "L2", "L3", "R2"].sort());
    eq("D6 palm", keys("D6"), ["octave", "palmD"].sort());
    eq("F6 palms", keys("F6"), ["octave", "palmD", "palmEb", "palmF", "sideE"].sort());
    ok("A3 out of range", F.lookupWritten("A3").outOfRange);
    ok("G6 out of range", F.lookupWritten("G6").outOfRange);
    eq("written G4 concert midi", F.writtenToConcert(F.nameToMidi("G4")), F.nameToMidi("Bb3"));

    const demo = DEMO_SONG;
    ok("demo 12 bars", demo.notes.reduce((s, n) => s + n.dur, 0) === 48);
    const used = {};
    demo.notes.forEach(n => { if (!n.rest) used[n.pitch] = 1; });
    eq("demo pitch set", Object.keys(used).sort(), ["A4", "Bb4", "C5", "D5", "Eb5", "F5", "G4", "G5"]);
    ok("demo has two whole rests", demo.notes.filter(n => n.rest && n.dur === 4).length === 2);

    const xml = `<?xml version="1.0"?>
<score-partwise version="3.1">
  <work><work-title>Mini</work-title></work>
  <part-list><score-part id="P1"><part-name>Alto Saxophone</part-name></score-part></part-list>
  <part id="P1">
    <measure number="1">
      <attributes><divisions>2</divisions>
        <time><beats>4</beats><beat-type>4</beat-type></time>
      </attributes>
      <note><pitch><step>G</step><octave>4</octave></pitch><duration>1</duration><voice>1</voice><type>eighth</type></note>
      <note><pitch><step>A</step><octave>4</octave></pitch><duration>1</duration><voice>1</voice><type>eighth</type></note>
      <note><pitch><step>B</step><alter>-1</alter><octave>4</octave></pitch><duration>2</duration><voice>1</voice><type>quarter</type></note>
      <note><rest/><duration>4</duration><voice>1</voice><type>half</type></note>
    </measure>
  </part>
</score-partwise>`;
    const parsed = SongParser.parseMusicXML(xml);
    eq("xml title", parsed.title, "Mini");
    eq("xml n notes", parsed.notes.length, 4);
    eq("xml first pitch", parsed.notes[0].pitch, "G4");
    eq("xml Bb", parsed.notes[2].pitch, "Bb4");
    ok("xml rest", parsed.notes[3].rest);
    eq("xml eighth dur", parsed.notes[0].dur, 0.5);
    eq("xml quarter dur", parsed.notes[2].dur, 1);
    eq("xml half rest", parsed.notes[3].dur, 2);

    const js = SongParser.parseJSONSong({ title: "J", notes: [{ pitch: "C5", dur: 2 }] });
    eq("json C5 midi", js.notes[0].midi, F.nameToMidi("C5"));

    let threw = false;
    try { SongParser.parseMusicXML("<not-music></not-music>"); } catch (e) { threw = true; }
    ok("bad xml throws", threw);

    const chordXml = `<?xml version="1.0"?><score-partwise><part-list><score-part id="P1"><part-name>Sax</part-name></score-part></part-list>
    <part id="P1"><measure>
      <attributes><divisions>1</divisions></attributes>
      <note><pitch><step>G</step><octave>4</octave></pitch><duration>1</duration><voice>1</voice></note>
      <note><chord/><pitch><step>B</step><octave>4</octave></pitch><duration>1</duration><voice>1</voice></note>
    </measure></part></score-partwise>`;
    const ch = SongParser.parseMusicXML(chordXml);
    eq("skip chord extra", ch.notes.length, 1);
    eq("melody is G4", ch.notes[0].pitch, "G4");

    const two = `<?xml version="1.0"?><score-partwise>
      <part-list>
        <score-part id="P1"><part-name>Piano</part-name></score-part>
        <score-part id="P2"><part-name>Alto Sax</part-name></score-part>
      </part-list>
      <part id="P1"><measure><attributes><divisions>1</divisions></attributes>
        <note><pitch><step>C</step><octave>4</octave></pitch><duration>1</duration><voice>1</voice></note>
      </measure></part>
      <part id="P2"><measure><attributes><divisions>1</divisions></attributes>
        <direction><direction-type><metronome><beat-unit>quarter</beat-unit><per-minute>72</per-minute></metronome></direction-type>
        <sound tempo="72"/></direction>
        <note><pitch><step>G</step><octave>4</octave></pitch><duration>1</duration><voice>1</voice></note>
      </measure></part>
    </score-partwise>`;
    const a = SongParser.parseMusicXML(two);
    eq("default first part", a.notes[0].pitch, "C4");
    eq("parts count", a.parts.length, 2);
    const b = SongParser.parseMusicXML(two, { partId: "P2" });
    eq("picked sax part", b.notes[0].pitch, "G4");
    eq("picked part name", b.partName, "Alto Sax");
    eq("metronome/sound tempo", b.bpm, 72);

    const soundOnly = `<?xml version="1.0"?><score-partwise><part-list><score-part id="P1"><part-name>Sax</part-name></score-part></part-list>
      <part id="P1"><measure><attributes><divisions>1</divisions></attributes>
      <sound tempo="108"/>
      <note><rest/><duration>1</duration><voice>1</voice></note>
      </measure></part></score-partwise>`;
    eq("sound tempo", SongParser.parseMusicXML(soundOnly).bpm, 108);

    eq("Bb alt Bis", (F.lookupWritten("Bb4").alt || []).slice().sort(), ["L1", "Bis"].sort());
    eq("keysPhrase G4", F.keysPhrase(["L1","L2","L3"]), "左1、左2、左3");
    F.setBbStyle("bis");
    eq("Bb4 bis keys", keys("Bb4"), ["L1", "Bis"].sort());
    eq("Bb5 bis keys", keys("Bb5"), ["octave", "L1", "Bis"].sort());
    eq("G4 unchanged in bis", keys("G4"), ["L1", "L2", "L3"].sort());
    F.setBbStyle("side");
    eq("Bb4 side restore", keys("Bb4"), ["L1", "L2", "sideBb"].sort());
    F.setInstrument("yas-280");
    ok("YAS A3 out of range", F.lookupWritten("A3").outOfRange);
    eq("YAS G4", keys("G4"), ["L1", "L2", "L3"].sort());
    F.setInstrument("yds-150");
    ok("YDS A3 in range", !F.lookupWritten("A3").outOfRange);
    eq("YDS A3 Low A", keys("A3"), ["L1", "L2", "L3", "R1", "R2", "R3", "lowA"].sort());
    eq("YDS G4 same table", keys("G4"), ["L1", "L2", "L3"].sort());
    eq("YDS C5 L2", keys("C5"), ["L2"]);
    F.setInstrument("yas-280");
    ok("YAS A3 still oor", F.lookupWritten("A3").outOfRange);

    const T = window.PitchTuner;
    ok("tuner loaded", !!T);
    eq("G4 concert midi", F.writtenToConcert(F.nameToMidi("G4")), F.nameToMidi("Bb3"));
    const bb3hz = T.midiToFreq(F.nameToMidi("Bb3"));
    ok("concert Bb3 ~233Hz", Math.abs(bb3hz - 233.08) < 0.2);
    eq("written from concert Bb3 freq", Math.round(T.freqToMidi(bb3hz) + 9), F.nameToMidi("G4"));
    ok("G4 target concert is Bb3", Math.abs(T.midiToFreq(F.nameToMidi("G4") - 9) - bb3hz) < 0.001);
    function sine(freq, sr, n) {
      const b = new Float32Array(n);
      for (let i = 0; i < n; i++) b[i] = 0.4 * Math.sin(2 * Math.PI * freq * i / sr);
      return b;
    }
    const det = T.analyze(sine(bb3hz, 44100, 2048), 44100);
    ok("yin ok on Bb3", det.ok);
    ok("yin freq near Bb3", det.ok && Math.abs(det.freq - bb3hz) < 3);
    eq("yin concert midi Bb3", det.concertMidi, 58);
    eq("yin written midi G4", det.writtenMidi, 67);
    eq("verdict G4 match", T.verdict(det, 67).state, "match");
    eq("verdict vs A4 wrong", T.verdict(det, F.nameToMidi("A4")).state, "wrong");
    const quiet = new Float32Array(2048);
    eq("noise gate quiet", T.analyze(quiet, 44100).ok, false);

    const grouped = window.ScoreLibrary.groupItems([
      { folder: "Jazz_Standards", path: "Jazz_Standards/Take_Five.musicxml" },
      { folder: "中文歌_入門", path: "中文歌_入門/01_月夜愁.musicxml" },
      { folder: "動畫主題", path: "動畫主題/鄰家的龍貓.musicxml" }
    ]);
    eq("lib folder order", grouped.map(function (g) { return g.folder; }), ["中文歌_入門", "動畫主題", "Jazz_Standards"]);

    function crc32(buf) {
      let c = 0xffffffff;
      for (let i = 0; i < buf.length; i++) {
        c ^= buf[i];
        for (let j = 0; j < 8; j++) c = (c >>> 1) ^ ((c & 1) ? 0xedb88320 : 0);
      }
      return (c ^ 0xffffffff) >>> 0;
    }
    function zipStore(files) {
      const enc = new TextEncoder();
      const locals = [];
      const cds = [];
      let offset = 0;
      files.forEach(function (f) {
        const name = enc.encode(f.name);
        const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
        const crc = crc32(data);
        const lh = new Uint8Array(30 + name.length + data.length);
        const v = new DataView(lh.buffer);
        v.setUint32(0, 0x04034b50, true);
        v.setUint16(4, 20, true);
        v.setUint16(6, 0x800, true);
        v.setUint32(14, crc, true);
        v.setUint32(18, data.length, true);
        v.setUint32(22, data.length, true);
        v.setUint16(26, name.length, true);
        lh.set(name, 30);
        lh.set(data, 30 + name.length);
        const cd = new Uint8Array(46 + name.length);
        const w = new DataView(cd.buffer);
        w.setUint32(0, 0x02014b50, true);
        w.setUint16(4, 20, true);
        w.setUint16(6, 20, true);
        w.setUint16(8, 0x800, true);
        w.setUint32(16, crc, true);
        w.setUint32(20, data.length, true);
        w.setUint32(24, data.length, true);
        w.setUint16(28, name.length, true);
        w.setUint32(42, offset, true);
        cd.set(name, 46);
        locals.push(lh);
        cds.push(cd);
        offset += lh.length;
      });
      const cdStart = offset;
      let cdSize = 0;
      cds.forEach(function (c) { cdSize += c.length; });
      const eocd = new Uint8Array(22);
      const e = new DataView(eocd.buffer);
      e.setUint32(0, 0x06054b50, true);
      e.setUint16(8, files.length, true);
      e.setUint16(10, files.length, true);
      e.setUint32(12, cdSize, true);
      e.setUint32(16, cdStart, true);
      const out = new Uint8Array(cdStart + cdSize + 22);
      let p = 0;
      locals.forEach(function (x) { out.set(x, p); p += x.length; });
      cds.forEach(function (x) { out.set(x, p); p += x.length; });
      out.set(eocd, p);
      return out;
    }
    async function zipDeflate(files) {
      const enc = new TextEncoder();
      const prepared = [];
      for (let i = 0; i < files.length; i++) {
        const f = files[i];
        const name = enc.encode(f.name);
        const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
        const compressed = new Uint8Array(await new Response(
          new Blob([data]).stream().pipeThrough(new CompressionStream("deflate-raw"))
        ).arrayBuffer());
        prepared.push({ name: name, data: data, compressed: compressed, crc: crc32(data) });
      }
      const locals = [];
      const cds = [];
      let offset = 0;
      prepared.forEach(function (f) {
        const lh = new Uint8Array(30 + f.name.length + f.compressed.length);
        const v = new DataView(lh.buffer);
        v.setUint32(0, 0x04034b50, true);
        v.setUint16(4, 20, true);
        v.setUint16(6, 0x800, true);
        v.setUint16(8, 8, true);
        v.setUint32(14, f.crc, true);
        v.setUint32(18, f.compressed.length, true);
        v.setUint32(22, f.data.length, true);
        v.setUint16(26, f.name.length, true);
        lh.set(f.name, 30);
        lh.set(f.compressed, 30 + f.name.length);
        const cd = new Uint8Array(46 + f.name.length);
        const w = new DataView(cd.buffer);
        w.setUint32(0, 0x02014b50, true);
        w.setUint16(4, 20, true);
        w.setUint16(6, 20, true);
        w.setUint16(8, 0x800, true);
        w.setUint16(10, 8, true);
        w.setUint32(16, f.crc, true);
        w.setUint32(20, f.compressed.length, true);
        w.setUint32(24, f.data.length, true);
        w.setUint16(28, f.name.length, true);
        w.setUint32(42, offset, true);
        cd.set(f.name, 46);
        locals.push(lh);
        cds.push(cd);
        offset += lh.length;
      });
      const cdStart = offset;
      let cdSize = 0;
      cds.forEach(function (c) { cdSize += c.length; });
      const eocd = new Uint8Array(22);
      const e = new DataView(eocd.buffer);
      e.setUint32(0, 0x06054b50, true);
      e.setUint16(8, files.length, true);
      e.setUint16(10, files.length, true);
      e.setUint32(12, cdSize, true);
      e.setUint32(16, cdStart, true);
      const out = new Uint8Array(cdStart + cdSize + 22);
      let p = 0;
      locals.forEach(function (x) { out.set(x, p); p += x.length; });
      cds.forEach(function (x) { out.set(x, p); p += x.length; });
      out.set(eocd, p);
      return out;
    }
    ok("zip magic", window.SongParser.isZip(zipStore([{ name: "a.xml", data: "<x/>" }])));

    ok("min display 300ms", window.AltoApp ? window.AltoApp.MIN_DISPLAY_SEC === 0.3 : true);

    function finish() {
      lines.push("");
      lines.push(failed ? ("FAILED " + failed) : "ALL PASSED");
      document.getElementById("out").innerHTML = lines.map(l => {
        const cls = l.indexOf("FAIL") === 0 ? "fail" : l.indexOf("OK") === 0 || l === "ALL PASSED" ? "ok" : "";
        return "<div class='" + cls + "'>" + l.replace(/</g, "&lt;") + "</div>";
      }).join("");
      document.title = failed ? "SELFTEST FAIL" : "SELFTEST PASS";
      window.__SELFTEST = { failed: failed, lines: lines };
    }

    const containerXml = `<?xml version="1.0"?><container><rootfiles><rootfile full-path="tune.xml" media-type="application/vnd.recordare.musicxml+xml"/></rootfiles></container>`;
    const mxlBytes = zipStore([
      { name: "META-INF/container.xml", data: containerXml },
      { name: "tune.xml", data: xml }
    ]);

    fetch("practice-riff.musicxml").then(r => r.text()).then(t => {
      const song = SongParser.parseMusicXML(t);
      eq("file title", song.title, "Practice Riff");
      ok("file ~12 bars", Math.abs(song.notes.reduce((s, n) => s + n.dur, 0) - 48) < 0.01);
      ok("file has rests", song.notes.filter(n => n.rest).length >= 2);
      eq("file first", song.notes[0].pitch, "G4");
      return SongParser.parseFile(mxlBytes, "mini.mxl");
    }).then(mxl => {
      eq("mxl title", mxl.title, "Mini");
      eq("mxl source", mxl.source, "mxl");
      eq("mxl n notes", mxl.notes.length, 4);
      eq("mxl first", mxl.notes[0].pitch, "G4");
      eq("mxl Bb", mxl.notes[2].pitch, "Bb4");
      ok("mxl rest", mxl.notes[3].rest);
      if (typeof CompressionStream === "undefined") return null;
      return zipDeflate([
        { name: "META-INF/container.xml", data: containerXml },
        { name: "tune.xml", data: xml }
      ]).then(function (bytes) { return SongParser.parseFile(bytes, "mini-deflate.mxl"); });
    }).then(deflated => {
      if (deflated) {
        eq("mxl deflate title", deflated.title, "Mini");
        eq("mxl deflate first", deflated.notes[0].pitch, "G4");
        eq("mxl deflate source", deflated.source, "mxl");
      }
      finish();
    }).catch(e => {
      ok("fetch/mxl " + e, false);
      finish();
    });
  </script>
</body>
</html>
